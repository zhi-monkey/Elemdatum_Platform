# 配置数据源
spring:
  redis:
    # 数据库索引(本地设置8)
    database: 8
    host: 210.30.96.107
    port: 30379
    password: DUBHE_REDIS_PASSWORD
    # 连接超时时间
    timeout: 5000
  datasource:
    druid:
      removeAbandoned: false
      logAbandoned: false
      db-type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      url: jdbc:log4jdbc:mysql://10.8.176.79:31441/mineai_cz?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowMultiQueries=true&useInformationSchema=true&rewriteBatchedStatements=true&autoReconnect=true
      username: user
      password: Aa123456789.

      # 初始化配置
      initial-size: 3
      # 最小连接数
      min-idle: 3
      # 最大连接数
      max-active: 15
      # 获取连接超时时间
      max-wait: 5000
      # 连接有效性检测时间
      time-between-eviction-runs-millis: 90000
      # 最大空闲时间
      min-evictable-idle-time-millis: 1800000
      test-while-idle: true
      test-on-borrow: true
      test-on-return: true

      validation-query: select 1
      # 配置监控统计拦截的filters
      filters: stat
      stat-view-servlet:
        url-pattern: /druid/*
        reset-enable: false

      web-stat-filter:
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
  # 配置允许后面的Bean覆盖前面名称重复的Bean
  main:
    allow-bean-definition-overriding: true

# logback
logging.config:
  classpath:logback.xml

# 文件存储服务配置
storage:
  # 文件存储服务暴露的IP地址 如需测试需修改为合适的地址
  file-store: 210.30.97.57
  # 文件存储服务端 共享目录
  file-store-root-path: /nfs/
  file-store-root-windows-path: "Z:"

# minio配置
