server:
  port: 80
  ssl:
    enabled: false

spring:
  cloud:
    gateway:
      httpclient:
        websocket:
          max-frame-payload-length: 2097152 # 2M
          
      routes:  
        - id: mineai-model-manager
          uri: lb://mineai-model-manager
          predicates:
            - Path=/mm/**
          filters:
            - StripPrefix=1
        # dubhe admin服务
        - id: admin-route
        # uri=> lb://服务名称  
          uri: lb://dubhe-admin
        # 路由规则
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=3
        # dubhe auth服务
        - id: auth-route
          uri: lb://dubhe-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=3
        # dubhe data(数据集)服务
        - id: dubhe-data
        # uri=> lb://服务名称  
          uri: lb://dubhe-data
        # 路由规则
          predicates:
            - Path=/api/v1/data/**
          filters: 
            - StripPrefix=3            
        - id: mineai-ui
          uri: http://localhost:3100/
          predicates:
            - Path=/**

