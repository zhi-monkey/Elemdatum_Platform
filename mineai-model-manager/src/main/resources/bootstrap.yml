# 不会在动态配置推送中覆盖的固定配置
# 优先于application.yml加载
nacos-env: data-element
server:
  port: 0
spring:
  application:
    name: mineai-model-manager
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ${nacos-env}
      config:
        server-addr: localhost:8848
        file-extension: yml
        namespace: ${nacos-env}

        extension-configs[0]:
          data-id: mysql.yml # MySQL连接配置
          group: DEFAULT_GROUP
          refresh: false
        extension-configs[1]:
          data-id: jpa.yml # JPA DEBUG配置
          group: DEFAULT_GROUP
          refresh: false
        extension-configs[2]:
          data-id: mq.yml # RocketMQ连接配置
          group: DEFAULT_GROUP
          refresh: false
        extension-configs[3]:
          data-id: redis.yml # Redis连接配置
          group: DEFAULT_GROUP
          refresh: false
        extension-configs[4]:
          data-id: inet.yml # 服务注册所用IP配置
          group: DEFAULT_GROUP
          refresh: false
        extension-configs[5]:
          data-id: zlmediakit.yml # 流媒体服务器相关配置
          group: DEFAULT_GROUP
          refresh: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource

